<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Paria Canyon — Trip Map</title>
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── LEFT COLUMN: map + elevation strip ── */
    .map-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    #map { flex: 1; min-height: 0; }

    #elevation-strip {
      height: 160px;
      flex-shrink: 0;
      background: #0e0e0e;
      border-top: 1px solid #222;
      position: relative;
    }
    #elevation-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    #chart-cursor {
      position: absolute;
      top: 0; bottom: 0;
      width: 1px;
      background: rgba(255,255,255,0.35);
      pointer-events: none;
      display: none;
    }
    #chart-tooltip {
      position: absolute;
      top: 8px;
      background: rgba(0,0,0,0.82);
      color: #ccc;
      font-size: 11px;
      font-family: -apple-system, "Segoe UI", sans-serif;
      line-height: 1.65;
      padding: 5px 9px;
      border-radius: 4px;
      pointer-events: none;
      display: none;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.08);
    }
    #chart-tooltip .tt-time { color: #fff; font-weight: 600; }
    #chart-tooltip .tt-ele  { color: #888; }

    /* ── RIGHT PANEL ── */
    .right-panel {
      width: 360px;
      flex-shrink: 0;
      background: #161616;
      border-left: 1px solid #252525;
      display: flex;
      flex-direction: column;
      padding: 16px 14px 14px;
      gap: 10px;
      overflow-y: auto;
    }

    .rp-header h1 {
      margin: 0 0 3px;
      font-size: 15px;
      font-weight: 700;
      color: #f0ede8;
      letter-spacing: 0.01em;
    }
    .rp-header p {
      margin: 0;
      font-size: 11px;
      color: #555;
    }

    .rp-photo {
      background: #111;
      border-radius: 5px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .rp-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .rp-photo img.visible { display: block; }
    .rp-placeholder {
      color: #333;
      font-size: 12px;
      text-align: center;
      line-height: 2;
      letter-spacing: 0.03em;
    }

    .rp-meta { flex-shrink: 0; }
    .rp-meta .title {
      font-size: 13px;
      font-weight: 600;
      color: #ddd8d2;
      min-height: 1.2em;
    }
    .rp-meta .date {
      font-size: 11px;
      color: #555;
      margin-top: 2px;
    }

    .rp-caption {
      font-size: 12px;
      color: #666;
      line-height: 1.55;
      flex: 1;
    }

    .rp-nav {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .rp-nav button {
      flex: 1;
      padding: 8px 6px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #2e2e2e;
      background: #1e1e1e;
      color: #aaa;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .rp-nav button:hover:not(:disabled) { background: #2a2a2a; }
    .rp-nav button:disabled { opacity: 0.3; cursor: default; }
    .rp-nav .btn-primary {
      background: #d85a30;
      color: white;
      border-color: #d85a30;
    }
    .rp-nav .btn-primary:hover:not(:disabled) { background: #c04e28; }

    .rp-progress {
      font-size: 11px;
      color: #444;
      text-align: center;
      flex-shrink: 0;
    }

    .rp-controls {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .rp-controls button {
      flex: 1;
      padding: 5px 4px;
      font-size: 11px;
      border: 1px solid #2a2a2a;
      background: #1a1a1a;
      color: #777;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .rp-controls button:hover { background: #242424; }

    /* ── MAP MARKERS ── */
    .photo-marker {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #d85a30;
      border: 3px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 13px;
      transition: transform 0.15s;
    }
    .photo-marker:hover { transform: scale(1.2); }
    .photo-marker.active {
      background: #fff;
      color: #d85a30;
      border-color: #d85a30;
      transform: scale(1.25);
    }

    /* ── POPUP (stays on map, minimal) ── */
    .maplibregl-popup-content {
      padding: 0;
      border-radius: 6px;
      overflow: hidden;
      max-width: 160px;
      background: #1c1c1c;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .maplibregl-popup-tip { border-top-color: #1c1c1c !important; }
    .photo-popup img { width: 100%; display: block; }
    .photo-popup .pop-meta {
      padding: 5px 8px;
      font-size: 10px;
      color: #777;
    }

    /* ── DEBUG PANEL ── */
    #debug-panel {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.78);
      color: #00ff41;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 11px;
      line-height: 1.8;
      padding: 10px 14px;
      border-radius: 4px;
      z-index: 10;
      pointer-events: none;
      min-width: 220px;
    }
    #debug-panel.visible { display: block; }
    #debug-panel .dbg-label { color: #555; }
    #debug-panel .dbg-section { border-top: 1px solid #222; margin-top: 6px; padding-top: 6px; }
  </style>
</head>
<body>

<div class="map-col">
  <div id="map"></div>
  <div id="elevation-strip">
    <canvas id="elevation-canvas"></canvas>
    <div id="chart-cursor"></div>
    <div id="chart-tooltip"></div>
  </div>
  <div id="debug-panel">
    <div><span class="dbg-label">lng  </span><span id="dbg-lng">—</span></div>
    <div><span class="dbg-label">lat  </span><span id="dbg-lat">—</span></div>
    <div><span class="dbg-label">zoom </span><span id="dbg-zoom">—</span></div>
    <div><span class="dbg-label">bear </span><span id="dbg-bear">—</span></div>
    <div><span class="dbg-label">pitch</span><span id="dbg-pitch">—</span></div>
    <div class="dbg-section">
      <div><span class="dbg-label">photo</span><span id="dbg-photo">—</span></div>
      <div><span class="dbg-label">exif° </span><span id="dbg-exif">—</span></div>
    </div>
  </div>
</div>

<div class="right-panel">
  <div class="rp-header">
    <h1>Paria Canyon</h1>
    <p>White House TH → Lees Ferry · Apr 4–8, 2026</p>
  </div>
  <div class="rp-photo">
    <img id="rp-img" src="" alt="" />
    <div class="rp-placeholder" id="rp-placeholder">Click Next →<br>to begin</div>
  </div>
  <div class="rp-meta">
    <div class="title" id="rp-title"></div>
    <div class="date" id="rp-date"></div>
  </div>
  <div class="rp-caption" id="rp-caption"></div>
  <div class="rp-nav">
    <button onclick="stepTo(currentIdx - 1)" id="btn-prev" disabled>← Prev</button>
    <button onclick="stepTo(currentIdx + 1)" id="btn-next" class="btn-primary">Next →</button>
  </div>
  <div class="rp-progress" id="progress">— of 12</div>
  <div class="rp-controls">
    <button onclick="resetView()">Overview</button>
    <button onclick="toggleTerrain()">3D</button>
    <button onclick="toggleSatellite()" id="btn-satellite">Satellite</button>
  </div>
</div>

    { id:  9, lng: -111.665864, lat: 36.932278, date: 'Apr 6', title: 'Photo 9',  caption: LOREM, img: 'photos/test1/IMG_7581.jpeg', bearing: 307.9, routeFrac: 0.8005 },
    { id: 10, lng: -111.664694, lat: 36.931631, date: 'Apr 6', title: 'Photo 10', caption: LOREM, img: 'photos/test1/IMG_7586.jpeg', bearing: 340.1, routeFrac: 0.8005 },
    { id: 11, lng: -111.664703, lat: 36.931622, date: 'Apr 6', title: 'Photo 11', caption: LOREM, img: 'photos/test1/IMG_7587.jpeg', bearing:  62.1, routeFrac: 0.8005 },
    { id: 12, lng: -111.587272, lat: 36.865428, date: 'Apr 7', title: 'Lees Ferry', caption: LOREM, img: 'photos/test1/IMG_7613.jpeg', bearing: 214.2, routeFrac: 1.0000 },
  ];

  // ============================================================
  // MAP SETUP
  // ============================================================
  const initialView = { center: [-111.741, 36.973], zoom: 10, pitch: 60, bearing: -15 };

  const map = new maplibregl.Map({
    container: 'map',
    style: `https://api.maptiler.com/maps/topo-v2/style.json?key=${MAPTILER_KEY}`,
    ...initialView,
    maxPitch: 85
  });

  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));
  map.addControl(new maplibregl.ScaleControl({ unit: 'imperial' }));

  let terrainOn = true;

  map.on('load', () => {
    setSatelliteButtonState(true);

    map.addSource('terrain', {
      type: 'raster-dem',
      url: `https://api.maptiler.com/tiles/terrain-rgb-v2/tiles.json?key=${MAPTILER_KEY}`,
      tileSize: 256
    });
    map.setTerrain({ source: 'terrain', exaggeration: 1.5 });

    map.setSky({
      'sky-color': '#a8c8e6', 'sky-horizon-blend': 0.6,
      'horizon-color': '#f0e6d6', 'horizon-fog-blend': 0.8,
      'fog-color': '#e8dcc8', 'fog-ground-blend': 0.3
    });

    map.addLayer({
      id: 'hillshade', type: 'hillshade', source: 'terrain',
      paint: { 'hillshade-shadow-color': '#3a2a1a', 'hillshade-highlight-color': '#fff8e8', 'hillshade-exaggeration': 0.5 }
    });

    map.addSource('satellite', {
      type: 'raster',
      url: `https://api.maptiler.com/tiles/satellite/tiles.json?key=${MAPTILER_KEY}`,
      tileSize: 256
    });
    map.addLayer({
      id: 'satellite-layer', type: 'raster', source: 'satellite',
      layout: { visibility: 'visible' },
      paint: { 'raster-opacity': 1.0 }
    }, 'hillshade');

    map.addSource('route', { type: 'geojson', data: route });
    map.addLayer({
      id: 'route-shadow', type: 'line', source: 'route',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#000', 'line-width': 6, 'line-opacity': 0.25, 'line-blur': 3 }
    });
    map.addLayer({
      id: 'route-line', type: 'line', source: 'route',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#d85a30', 'line-width': 3 }
    });

    markers = photos.map(photo => {
      const el = document.createElement('div');
      el.className = 'photo-marker';
      el.textContent = photo.id;

      const popup = new maplibregl.Popup({ offset: 20, closeButton: false })
        .setHTML(`
          <div class="photo-popup">
            <img src="${photo.img}" alt="${photo.title}" />
            <div class="pop-meta">${photo.title} · ${photo.date}</div>
          </div>
        `);

      const marker = new maplibregl.Marker({ element: el })
        .setLngLat([photo.lng, photo.lat])
        .setPopup(popup)
        .addTo(map);

      el.addEventListener('click', () => stepTo(photos.indexOf(photo), true));
      return marker;
    });

    drawElevationChart();
  });

  // ============================================================
  // ELEVATION CHART
  // ============================================================
  const CHART_PAD = { top: 18, right: 20, bottom: 28, left: 48 };

  function elevationAtFrac(frac) {
    for (let i = 1; i < elevationProfile.length; i++) {
      if (elevationProfile[i][0] >= frac) {
        const [f0, e0] = elevationProfile[i - 1];
        const [f1, e1] = elevationProfile[i];
        const t = f1 === f0 ? 0 : (frac - f0) / (f1 - f0);
        return e0 + t * (e1 - e0);
      }
    }
    return elevationProfile[elevationProfile.length - 1][1];
  }

  function hourAtFrac(frac) {
    for (let i = 1; i < elevationProfile.length; i++) {
      if (elevationProfile[i][0] >= frac) {
        const [f0,, h0] = elevationProfile[i - 1];
        const [f1,, h1] = elevationProfile[i];
        if (h1 < h0 - 2) return h0; // overnight gap — don't interpolate
        const t = f1 === f0 ? 0 : (frac - f0) / (f1 - f0);
        return h0 + t * (h1 - h0);
      }
    }
    return elevationProfile[elevationProfile.length - 1][2];
  }

  function dayAtFrac(frac) {
    if (frac < 0.3308) return 1;
    if (frac < 0.6653) return 2;
    return 3;
  }

  // Map hour of day → rgba components for background tint
  function timeToRGBA(h) {
    const stops = [
      [0,    [8,  12, 45,  0.95]],  // deep night
      [6.0,  [30, 50, 120, 0.80]],  // pre-dawn blue
      [7.0,  [50, 90, 160, 0.55]],  // dawn blue
      [8.5,  [70, 120,190, 0.40]],  // morning blue
      [10.0, [110,160,210, 0.28]],  // brightening blue
      [11.0, [180,200,220, 0.18]],  // hazy transition
      [12.0, [255,230,150, 0.22]],  // peak sun warm
      [13.5, [255,225,130, 0.28]],  // peak sun bright
      [15.0, [255,215,120, 0.26]],  // mid-afternoon
      [16.0, [200,190,220, 0.22]],  // cooling starts
      [17.0, [120,130,200, 0.38]],  // cool blue evening
      [18.0, [70, 80, 170, 0.55]],  // deepening blue
      [19.0, [40, 45, 120, 0.72]],  // dusk blue-purple
      [20.5, [12, 15, 50,  0.90]],  // night
      [24.0, [8,  12, 45,  0.95]],  // deep night
    ];
    for (let i = 1; i < stops.length; i++) {
      if (h <= stops[i][0]) {
        const t = (h - stops[i-1][0]) / (stops[i][0] - stops[i-1][0]);
        const [r0,g0,b0,a0] = stops[i-1][1];
        const [r1,g1,b1,a1] = stops[i][1];
        return [
          Math.round(r0 + t*(r1-r0)),
          Math.round(g0 + t*(g1-g0)),
          Math.round(b0 + t*(b1-b0)),
          +(a0 + t*(a1-a0)).toFixed(3)
        ];
      }
    }
    return stops[stops.length-1][1];
  }

  function formatHour(h) {
    const hr = Math.floor(h), mn = Math.round((h - hr) * 60);
    const ampm = hr >= 12 ? 'PM' : 'AM';
    const hr12 = hr > 12 ? hr - 12 : (hr === 0 ? 12 : hr);
    return `${hr12}:${String(mn).padStart(2,'0')} ${ampm}`;
  }

  function drawElevationChart(activeIdx) {
    const canvas = document.getElementById('elevation-canvas');
    const strip  = document.getElementById('elevation-strip');
    const W = strip.clientWidth, H = strip.clientHeight;
    canvas.width  = W * devicePixelRatio;
    canvas.height = H * devicePixelRatio;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';

    const ctx = canvas.getContext('2d');
    ctx.scale(devicePixelRatio, devicePixelRatio);

    const P = CHART_PAD;
    const eles = elevationProfile.map(p => p[1]);
    const minE = Math.min(...eles), maxE = Math.max(...eles), rangeE = maxE - minE;
    const xS = f  => P.left + f  * (W - P.left - P.right);
    const yS = e  => H - P.bottom - ((e - minE) / rangeE) * (H - P.top - P.bottom);

    // 1. Time-of-day background gradient strips
    for (let i = 0; i < elevationProfile.length - 1; i++) {
      const [f0,,h0] = elevationProfile[i];
      const [f1,,h1] = elevationProfile[i+1];
      const x0 = xS(f0), x1 = xS(f1);
      const isOvernight = h1 < h0 - 2;

      if (isOvernight) {
        // Dark band representing the overnight camp
        ctx.fillStyle = 'rgba(4,4,18,0.96)';
        ctx.fillRect(x0, P.top, x1 - x0 + 1, H - P.top - P.bottom);
      } else {
        const [r0,g0,b0,a0] = timeToRGBA(h0);
        const [r1,g1,b1,a1] = timeToRGBA(h1);
        const grad = ctx.createLinearGradient(x0, 0, x1, 0);
        grad.addColorStop(0, `rgba(${r0},${g0},${b0},${a0})`);
        grad.addColorStop(1, `rgba(${r1},${g1},${b1},${a1})`);
        ctx.fillStyle = grad;
        ctx.fillRect(x0, P.top, x1 - x0 + 1, H - P.top - P.bottom);
      }
    }

    // Camp markers at overnight transitions
    const camps = [0.3308, 0.6653];
    camps.forEach(cf => {
      const cx = xS(cf);
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(cx - 0.5, P.top, 1, H - P.top - P.bottom);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.font = '9px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('camp', cx, P.top - 4);
    });

    // 2. Filled area under elevation line
    ctx.beginPath();
    elevationProfile.forEach(([f,e],i) => i===0 ? ctx.moveTo(xS(f),yS(e)) : ctx.lineTo(xS(f),yS(e)));
    ctx.lineTo(xS(1), H - P.bottom);
    ctx.lineTo(xS(0), H - P.bottom);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fill();

    // 3. Elevation line
    ctx.beginPath();
    elevationProfile.forEach(([f,e],i) => i===0 ? ctx.moveTo(xS(f),yS(e)) : ctx.lineTo(xS(f),yS(e)));
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // 4. Baseline
    ctx.beginPath();
    ctx.moveTo(xS(0), H - P.bottom);
    ctx.lineTo(xS(1), H - P.bottom);
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 5. Y-axis labels
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    const ftMin = Math.round(minE * 3.28084 / 100) * 100;
    const ftMax = Math.round(maxE * 3.28084 / 100) * 100;
    for (let ft = ftMin; ft <= ftMax; ft += 500) {
      const m = ft / 3.28084;
      if (m < minE || m > maxE) continue;
      const y = yS(m);
      ctx.fillText(ft.toLocaleString() + ' ft', P.left - 6, y + 3.5);
      ctx.beginPath();
      ctx.moveTo(P.left - 3, y);
      ctx.lineTo(xS(1), y);
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // 6. Photo squares
    const SQ = 9;
    photos.forEach((photo, i) => {
      const x = xS(photo.routeFrac);
      const y = yS(elevationAtFrac(photo.routeFrac));
      const isActive = i === activeIdx;
      const s = isActive ? SQ + 3 : SQ;
      ctx.fillStyle   = isActive ? '#ffffff' : '#d85a30';
      ctx.strokeStyle = isActive ? '#d85a30' : 'rgba(255,255,255,0.5)';
      ctx.lineWidth   = isActive ? 2 : 1.5;
      ctx.beginPath();
      ctx.rect(x - s/2, y - s/2, s, s);
      ctx.fill();
      ctx.stroke();
    });
  }

  // ── Hover: cursor line + tooltip ──
  (function() {
    const canvas  = document.getElementById('elevation-canvas');
    const strip   = document.getElementById('elevation-strip');
    const cursor  = document.getElementById('chart-cursor');
    const tooltip = document.getElementById('chart-tooltip');

    canvas.addEventListener('mousemove', e => {
      const W = strip.clientWidth, H = strip.clientHeight;
      const P = CHART_PAD;
      const chartW = W - P.left - P.right;
      const rect = strip.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const frac = Math.max(0, Math.min(1, (mx - P.left) / chartW));

      const ele  = elevationAtFrac(frac);
      const hour = hourAtFrac(frac);
      const day  = dayAtFrac(frac);
      const eleFt = Math.round(ele * 3.28084).toLocaleString();

      cursor.style.left    = mx + 'px';
      cursor.style.display = 'block';

      tooltip.innerHTML = `<span class="tt-time">${formatHour(hour)}</span> · Day ${day}<br><span class="tt-ele">${eleFt} ft</span>`;
      const tipW = 130;
      tooltip.style.left    = (mx + 12 + tipW > W ? mx - tipW - 6 : mx + 12) + 'px';
      tooltip.style.display = 'block';
    });

    canvas.addEventListener('mouseleave', () => {
      cursor.style.display  = 'none';
      tooltip.style.display = 'none';
    });

    // Click to navigate to nearest photo
    canvas.addEventListener('click', e => {
      const W = strip.clientWidth, H = strip.clientHeight;
      const P = CHART_PAD;
      const eles  = elevationProfile.map(p => p[1]);
      const minE  = Math.min(...eles), maxE = Math.max(...eles), rangeE = maxE - minE;
      const xS = f  => P.left + f  * (W - P.left - P.right);
      const yS = em => H - P.bottom - ((em - minE) / rangeE) * (H - P.top - P.bottom);
      const rect = strip.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const HIT = 14;
      for (let i = 0; i < photos.length; i++) {
        const px = xS(photos[i].routeFrac);
        const py = yS(elevationAtFrac(photos[i].routeFrac));
        if (Math.abs(mx - px) < HIT && Math.abs(my - py) < HIT) { stepTo(i, true); return; }
      }
    });
  })();

  window.addEventListener('resize', () => drawElevationChart(currentIdx >= 0 ? currentIdx : undefined));

  // ============================================================
  // CAMERA NAVIGATION
  // ============================================================
  let currentIdx = -1;
  let markers = [];

  function bearingBetween(a, b) {
    const toRad = d => d * Math.PI / 180;
    const toDeg = r => r * 180 / Math.PI;
    const dLng = toRad(b[0] - a[0]);
    const lat1 = toRad(a[1]), lat2 = toRad(b[1]);
    const y = Math.sin(dLng) * Math.cos(lat2);
    const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }

  function stepTo(idx, fromMarkerClick = false) {
    if (idx < 0 || idx >= photos.length) return;

    if (currentIdx >= 0) {
      markers[currentIdx].getElement().classList.remove('active');
      markers[currentIdx].getPopup().remove();
    }

    currentIdx = idx;
    const p = photos[idx];
    const next = photos[Math.min(idx + 1, photos.length - 1)];
    const bearing = bearingBetween([p.lng, p.lat], [next.lng, next.lat]);

    map.flyTo({
      center: [p.lng, p.lat], zoom: 13.5, pitch: 65, bearing,
      duration: fromMarkerClick ? 1400 : 2200, essential: true
    });

    map.once('moveend', () => {
      markers[currentIdx].getElement().classList.add('active');
      markers[currentIdx].togglePopup();
    });

    // Update right panel
    const img = document.getElementById('rp-img');
    const placeholder = document.getElementById('rp-placeholder');
    img.src = p.img;
    img.className = 'visible';
    placeholder.style.display = 'none';
    document.getElementById('rp-title').textContent = p.title;
    document.getElementById('rp-date').textContent = p.date;
    document.getElementById('rp-caption').textContent = p.caption;

    document.getElementById('btn-prev').disabled = idx === 0;
    document.getElementById('btn-next').disabled = idx === photos.length - 1;
    document.getElementById('btn-next').textContent = idx === photos.length - 1 ? 'Done' : 'Next →';
    document.getElementById('progress').textContent = `${idx + 1} of ${photos.length}`;

    drawElevationChart(idx);
  }

  function resetView() {
    if (currentIdx >= 0) {
      markers[currentIdx].getElement().classList.remove('active');
      markers[currentIdx].getPopup().remove();
    }
    currentIdx = -1;

    const img = document.getElementById('rp-img');
    img.className = '';
    img.src = '';
    document.getElementById('rp-placeholder').style.display = '';
    document.getElementById('rp-title').textContent = '';
    document.getElementById('rp-date').textContent = '';
    document.getElementById('rp-caption').textContent = '';
    document.getElementById('btn-prev').disabled = true;
    document.getElementById('btn-next').disabled = false;
    document.getElementById('btn-next').textContent = 'Next →';
    document.getElementById('progress').textContent = '— of 12';

    map.flyTo({ ...initialView, duration: 2000 });
    drawElevationChart();
  }

  function toggleTerrain() {
    terrainOn = !terrainOn;
    map.setTerrain(terrainOn ? { source: 'terrain', exaggeration: 1.5 } : null);
    map.easeTo({ pitch: terrainOn ? 60 : 0, duration: 800 });
  }

  // ============================================================
  // DEBUG PANEL — D key
  // ============================================================
  const debugPanel = document.getElementById('debug-panel');
  let debugOn = false;

  function updateDebug() {
    if (!debugOn) return;
    const c = map.getCenter();
    document.getElementById('dbg-lng').textContent   = c.lng.toFixed(6);
    document.getElementById('dbg-lat').textContent   = c.lat.toFixed(6);
    document.getElementById('dbg-zoom').textContent  = map.getZoom().toFixed(2);
    document.getElementById('dbg-bear').textContent  = map.getBearing().toFixed(1) + '°';
    document.getElementById('dbg-pitch').textContent = map.getPitch().toFixed(1) + '°';
    if (currentIdx >= 0) {
      const p = photos[currentIdx];
      document.getElementById('dbg-photo').textContent = `#${p.id} (${p.date})`;
      document.getElementById('dbg-exif').textContent  = p.bearing.toFixed(1) + '°';
    } else {
      document.getElementById('dbg-photo').textContent = '—';
      document.getElementById('dbg-exif').textContent  = '—';
    }
  }

  map.on('move', updateDebug);
  document.addEventListener('keydown', e => {
    if (e.key === 'd') {
      debugOn = !debugOn;
      debugPanel.classList.toggle('visible', debugOn);
      if (debugOn) updateDebug();
    }
  });

  // ============================================================
  // SATELLITE TOGGLE
  // ============================================================
  let satelliteOn = true;
  function setSatelliteButtonState(on) {
    const btn = document.getElementById('btn-satellite');
    btn.style.background = on ? '#d85a30' : '';
    btn.style.color = on ? 'white' : '';
    btn.style.borderColor = on ? '#d85a30' : '';
  }
  function toggleSatellite() {
    satelliteOn = !satelliteOn;
    map.setLayoutProperty('satellite-layer', 'visibility', satelliteOn ? 'visible' : 'none');
    setSatelliteButtonState(satelliteOn);
  }
</script>
</body>
</html>
