<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paria 2026 — Content Editor</title>
<style>
  :root {
    --bg: #14110e; --panel: #211c17; --panel2: #2b2520; --line: #3a3128;
    --ink: #f0e9df; --dim: #a99c8a; --accent: #d98b3f; --danger: #c45c4a;
    --ok: #6f9a5e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: rgba(20,17,14,.92);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
    display: flex; gap: 12px; align-items: center; padding: 12px 18px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .grow { flex: 1; }
  .count { color: var(--dim); font-size: 13px; }
  input[type=search] {
    background: var(--panel2); border: 1px solid var(--line); color: var(--ink);
    border-radius: 8px; padding: 7px 11px; width: 240px; font-size: 14px;
  }
  button {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a130a; font-weight: 600; }
  button.primary:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); display: inline-block; }
  .dot.dirty { background: var(--accent); }

  main { padding: 18px; display: grid; gap: 16px;
         grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          overflow: hidden; display: flex; flex-direction: column; }
  .card.hidden { display: none; }
  .thumb { aspect-ratio: 4/3; background: #0d0b09 center/cover no-repeat; position: relative; }
  .thumb .missing { position: absolute; inset: 0; display: grid; place-items: center;
                    color: var(--dim); font-size: 13px; }
  .badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.6);
           color: var(--dim); font-size: 11px; padding: 2px 7px; border-radius: 20px; }
  .body { padding: 12px; display: flex; flex-direction: column; gap: 9px; }
  .fname { font-size: 12px; color: var(--dim); font-family: ui-monospace, monospace;
           display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  label.f { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--dim); }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  textarea, select, input.t {
    width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--ink);
    border-radius: 7px; padding: 7px 9px; font-size: 14px; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 64px; }
  .del { color: var(--danger); background: transparent; border: none; cursor: pointer;
         font-size: 12px; padding: 2px 4px; }
  .del:hover { text-decoration: underline; }
  label.core { display: inline-flex; align-items: center; gap: 4px; font-size: 12px;
               color: var(--accent); cursor: pointer; user-select: none; }
  label.core input { accent-color: var(--accent); cursor: pointer; }
  .card.noncore { opacity: .5; }
  .card.noncore label.core { color: var(--dim); }
  select#coreFilter { background: var(--panel2); border: 1px solid var(--line); color: var(--ink);
                      border-radius: 8px; padding: 7px 9px; font-size: 14px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
           background: var(--ok); color: #0d130a; padding: 10px 18px; border-radius: 10px;
           font-weight: 600; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--danger); color: #fff; }
  dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line);
           border-radius: 12px; padding: 18px; width: min(440px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.55); }
</style>
</head>
<body>
<header>
  <h1>Paria 2026 · Content</h1>
  <span class="dot" id="dirtyDot" title="saved"></span>
  <span class="count" id="count"></span>
  <span class="grow"></span>
  <input type="search" id="search" placeholder="Search caption / file / person…">
  <select id="coreFilter" title="Filter by core-trip status">
    <option value="all">All photos</option>
    <option value="core">Core trip only</option>
    <option value="noncore">Non-core only</option>
  </select>
  <button id="addBtn" class="ghost">+ Add photo</button>
  <button id="saveBtn" class="primary" disabled>Save</button>
</header>

<main id="grid"></main>
<div class="toast" id="toast"></div>

<dialog id="addDialog">
  <h3 style="margin:0 0 12px">Add a photo</h3>
  <label class="f">Image file (from output/)</label>
  <input class="t" list="imgList" id="addImage" placeholder="start typing a filename…" style="margin:6px 0 14px">
  <datalist id="imgList"></datalist>
  <div class="row" style="justify-content:flex-end; gap:8px">
    <button class="ghost" id="addCancel">Cancel</button>
    <button class="primary" id="addConfirm">Add</button>
  </div>
</dialog>

<script>
const $ = (s, r=document) => r.querySelector(s);
let data = null, dirty = false;

function setDirty(v) {
  dirty = v;
  $('#dirtyDot').classList.toggle('dirty', v);
  $('#dirtyDot').title = v ? 'unsaved changes' : 'saved';
  $('#saveBtn').disabled = !v;
}

function personOptions(selected) {
  return Object.entries(data.people).map(([k, p]) =>
    `<option value="${k}" ${k===selected?'selected':''}>${p.name}</option>`).join('');
}

function card(p, i) {
  const badges = `${p._icloudCaption?'<span class="badge">iCloud caption</span>':''}`;
  const img = p.isVideo
    ? `<div class="thumb"><video src="${p.image}" muted preload="metadata" style="width:100%;height:100%;object-fit:cover"></video><span class="badge">video</span></div>`
    : p.image
    ? `<div class="thumb" style="background-image:url('${p.image}')">${badges}</div>`
    : `<div class="thumb"><div class="missing">no image on disk</div></div>`;
  const loc = p.location || {};
  return `<div class="card${p.coreTrip === false ? ' noncore' : ''}" data-i="${i}">
    ${img}
    <div class="body">
      <div class="fname"><span>${p.originalFilename || p.image || '(new)'}</span>
        <span style="display:flex;gap:10px;align-items:center">
          <label class="core" title="Part of the core trip?">
            <input type="checkbox" data-k="coreTrip" ${p.coreTrip !== false ? 'checked' : ''}> core
          </label>
          <button class="del" data-del="${i}">delete</button></span></div>

      <div class="row">
        <div><label class="f">Photographer</label>
          <select data-k="photographer">${personOptions(p.photographer)}</select></div>
        <div><label class="f">Caption by</label>
          <select data-k="captionAuthor">${personOptions(p.captionAuthor)}</select></div>
      </div>

      <div><label class="f">Caption</label>
        <textarea data-k="caption" placeholder="no caption">${p.caption || ''}</textarea></div>

      <div class="row">
        <div><label class="f">Lat</label>
          <input class="t" data-k="lat" value="${loc.lat ?? ''}" placeholder="—"></div>
        <div><label class="f">Lng</label>
          <input class="t" data-k="lng" value="${loc.lng ?? ''}" placeholder="—"></div>
      </div>
    </div>
  </div>`;
}

function render() {
  $('#grid').innerHTML = data.photos.map(card).join('');
  $('#count').textContent = `${data.photos.length} photos · ${data.photos.filter(p=>p.caption).length} captioned · ${data.photos.filter(p=>p.coreTrip===false).length} non-core`;
  applySearch();
}

// ── Edits ────────────────────────────────────────────────────────────────────
$('#grid').addEventListener('input', (e) => {
  const card = e.target.closest('.card'); if (!card) return;
  const p = data.photos[+card.dataset.i];
  const k = e.target.dataset.k; if (!k) return;
  if (k === 'coreTrip') {
    p.coreTrip = e.target.checked;
    card.classList.toggle('noncore', !e.target.checked);
  } else if (k === 'lat' || k === 'lng') {
    const lat = parseFloat($('[data-k=lat]', card).value);
    const lng = parseFloat($('[data-k=lng]', card).value);
    p.location = (isFinite(lat) && isFinite(lng)) ? { lat, lng } : null;
  } else {
    p[k] = e.target.value;
  }
  setDirty(true);
});

$('#grid').addEventListener('click', (e) => {
  const del = e.target.dataset.del;
  if (del == null) return;
  const p = data.photos[+del];
  if (!confirm(`Delete this photo entry?\n\n${p.originalFilename || p.image || ''}\n${(p.caption||'').slice(0,80)}`)) return;
  data.photos.splice(+del, 1);
  render(); setDirty(true);
});

// ── Search ───────────────────────────────────────────────────────────────────
function applySearch() {
  const q = $('#search').value.trim().toLowerCase();
  const cf = $('#coreFilter').value;
  document.querySelectorAll('.card').forEach((c) => {
    const p = data.photos[+c.dataset.i];
    const hay = [p.originalFilename, p.image, p.caption,
                 data.people[p.photographer]?.name, data.people[p.captionAuthor]?.name]
                 .join(' ').toLowerCase();
    const isCore = p.coreTrip !== false;
    const coreOk = cf === 'all' || (cf === 'core' ? isCore : !isCore);
    c.classList.toggle('hidden', (q && !hay.includes(q)) || !coreOk);
  });
}
$('#search').addEventListener('input', applySearch);
$('#coreFilter').addEventListener('change', applySearch);

// ── Add photo ────────────────────────────────────────────────────────────────
$('#addBtn').addEventListener('click', () => $('#addDialog').showModal());
$('#addCancel').addEventListener('click', () => $('#addDialog').close());
$('#addConfirm').addEventListener('click', () => {
  const file = $('#addImage').value.trim();
  data.photos.unshift({
    id: 'manual-' + Date.now(),
    image: file ? 'output/' + file.replace(/^output\//, '') : null,
    originalFilename: file || '(manual entry)',
    photographer: 'jon', caption: '', captionAuthor: 'jon', coreTrip: true,
    location: null, dateCreated: null, _icloudCaption: false, _uploaderResolved: false,
  });
  $('#addImage').value = '';
  $('#addDialog').close();
  render(); setDirty(true);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// ── Save ─────────────────────────────────────────────────────────────────────
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg;
  t.classList.toggle('err', !!err); t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
async function save() {
  try {
    const r = await fetch('/api/content', { method: 'POST', body: JSON.stringify(data) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    setDirty(false);
    toast(`Saved ${j.photos} photos (previous backed up)`);
  } catch (e) { toast('Save failed: ' + e.message, true); }
}
$('#saveBtn').addEventListener('click', save);
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); if (dirty) save(); }
});
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

// ── Boot ─────────────────────────────────────────────────────────────────────
(async function init() {
  data = await (await fetch('/api/content')).json();
  if (data.error) { document.body.innerHTML = `<p style="padding:40px">${data.error}</p>`; return; }
  render();
  const imgs = await (await fetch('/api/images')).json();
  $('#imgList').innerHTML = imgs.map((f) => `<option value="${f}">`).join('');
})();
</script>
</body>
</html>
