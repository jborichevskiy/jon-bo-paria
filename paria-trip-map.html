<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Paria Canyon — Trip Map</title>
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1a1a1a; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }

    .controls {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255,255,255,0.95);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 10;
      max-width: 240px;
    }
    .controls h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
    .controls p { margin: 0; color: #555; font-size: 12px; }
    .controls button {
      margin-top: 8px;
      padding: 4px 10px;
      font-size: 12px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 4px;
      cursor: pointer;
    }
    .controls button:hover { background: #f0f0f0; }

    .photo-marker {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #d85a30;
      border: 3px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 13px;
      transition: transform 0.15s;
    }
    .photo-marker:hover { transform: scale(1.2); }
    .photo-marker.active {
      background: #fff;
      color: #d85a30;
      border-color: #d85a30;
      transform: scale(1.25);
    }

    .nav-buttons {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .nav-buttons button {
      flex: 1;
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #ccc;
      background: white;
      border-radius: 4px;
      cursor: pointer;
    }
    .nav-buttons button:hover:not(:disabled) { background: #f0f0f0; }
    .nav-buttons button:disabled { opacity: 0.35; cursor: default; }
    .nav-buttons .btn-primary {
      background: #d85a30;
      color: white;
      border-color: #d85a30;
    }
    .nav-buttons .btn-primary:hover:not(:disabled) { background: #c04e28; }

    .progress {
      margin-top: 8px;
      font-size: 11px;
      color: #888;
      text-align: center;
    }

    .maplibregl-popup-content {
      padding: 0;
      border-radius: 8px;
      overflow: hidden;
      max-width: 280px;
    }
    .photo-popup img {
      width: 100%;
      display: block;
      background: #eee;
    }
    .photo-popup .caption {
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.4;
    }
    .photo-popup .caption .title {
      font-weight: 600;
      margin-bottom: 2px;
    }
    .photo-popup .caption .meta {
      color: #888;
      font-size: 11px;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div class="controls">
  <h1>Paria Canyon</h1>
  <p>White House TH → Lees Ferry. Click pins or use arrows.</p>
  <div class="nav-buttons">
    <button onclick="stepTo(currentIdx - 1)" id="btn-prev" disabled>← Prev</button>
    <button onclick="stepTo(currentIdx + 1)" id="btn-next" class="btn-primary">Next →</button>
  </div>
  <div class="nav-buttons" style="margin-top:4px">
    <button onclick="resetView()">Overview</button>
    <button onclick="toggleTerrain()">Toggle 3D</button>
  </div>
  <div class="progress" id="progress">Click Next to begin</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    }
  };

  // ============================================================
  // PHOTOS — 20 markers evenly spaced along the real GPS track
  // Replace img/title/caption/date with your actual photos
  // ============================================================
  const photos = [
    { id: 1,  lng: -111.890533, lat: 37.080723, title: 'Start',
      caption: 'Day 1.', date: 'Apr 4',
      img: 'https://placehold.co/400x280/d85a30/white?text=Photo+1' },
    { id: 2,  lng: -111.875198, lat: 37.057281, title: 'Photo 2',
      caption: '', date: 'Apr 4',
      img: 'https://placehold.co/400x280/d85a30/white?text=Photo+2' },
    { id: 3,  lng: -111.869591, lat: 37.029564, title: 'Photo 3',
      caption: '', date: 'Apr 4',
      img: 'https://placehold.co/400x280/d85a30/white?text=Photo+3' },
    { id: 4,  lng: -111.86615,  lat: 37.010246, title: 'Photo 4',
      caption: '', date: 'Apr 5',
      img: 'https://placehold.co/400x280/d85a30/white?text=Photo+4' },
    { id: 5,  lng: -111.862854, lat: 36.999832, title: 'Photo 5',
      caption: '', date: 'Apr 5',
      img: 'https://placehold.co/400x280/d85a30/white?text=Photo+5' },
    { id: 6,  lng: -111.862869, lat: 36.999474, title: 'Photo 6',
      caption: '', date: 'Apr 5',
      img: 'https://placehold.co/400x280/d85a30/white?text=Photo+6' },
    { id: 7,  lng: -111.85614,  lat: 36.985317, title: 'Photo 7',
      caption: '', date: 'Apr 5',
      img: 'https://placehold.co/400x280/d85a30/white?text=Photo+7' },
    { id: 8,  lng: -111.839188, lat: 36.98576,  title: 'Photo 8',
      caption: '', date: 'Apr 5',
      img: 'https://placehold.co/400x280/d85a30/white?text=Photo+8' },
    { id: 9,  lng: -111.819725, lat: 36.984344, title: 'Photo 9',
      caption: '', date: 'Apr 6',
      img: 'https://placehold.co/400x280/d85a30/white?text=Photo+9' },
    { id: 10, lng: -111.8032,   lat: 36.992027, title: 'Photo 10',
      caption: '', date: 'Apr 6',
      img: 'https://placehold.co/400x280/d85a30/white?text=Photo+10' },

    { id: 13, lng: -111.756462, lat: 36.964996, title: 'Photo 13',

    { id: 20, lng: -111.591164, lat: 36.866066, title: 'Lees Ferry',
      caption: 'Done.', date: 'Apr 8',
      img: 'https://placehold.co/400x280/d85a30/white?text=Photo+20' }
  ];

  // ============================================================
  // MAP SETUP
  // ============================================================
  const initialView = {
    center: [-111.741, 36.973],
    zoom: 10,
    pitch: 60,
    bearing: -15
  };

  const map = new maplibregl.Map({
    container: 'map',
    style: `https://api.maptiler.com/maps/topo-v2/style.json?key=${MAPTILER_KEY}`,
    ...initialView,
    maxPitch: 85
  });

  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));
  map.addControl(new maplibregl.ScaleControl({ unit: 'imperial' }));

  let terrainOn = true;

  map.on('load', () => {
    // Add terrain DEM source
    map.addSource('terrain', {
      type: 'raster-dem',
      url: `https://api.maptiler.com/tiles/terrain-rgb-v2/tiles.json?key=${MAPTILER_KEY}`,
      tileSize: 256
    });

    map.setTerrain({ source: 'terrain', exaggeration: 1.5 });

    // Sky layer for the horizon when pitched
    map.setSky({
      'sky-color': '#a8c8e6',
      'sky-horizon-blend': 0.6,
      'horizon-color': '#f0e6d6',
      'horizon-fog-blend': 0.8,
      'fog-color': '#e8dcc8',
      'fog-ground-blend': 0.3
    });

    // Hillshade for extra depth
    map.addLayer({
      id: 'hillshade',
      type: 'hillshade',
      source: 'terrain',
      paint: {
        'hillshade-shadow-color': '#3a2a1a',
        'hillshade-highlight-color': '#fff8e8',
        'hillshade-exaggeration': 0.5
      }
    });

    // Route line
    map.addSource('route', { type: 'geojson', data: route });
    map.addLayer({
      id: 'route-shadow',
      type: 'line',
      source: 'route',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: {
        'line-color': '#000',
        'line-width': 6,
        'line-opacity': 0.25,
        'line-blur': 3
      }
    });
    map.addLayer({
      id: 'route-line',
      type: 'line',
      source: 'route',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: {
        'line-color': '#d85a30',
        'line-width': 3
      }
    });

    // Photo markers
    photos.forEach(photo => {
      const el = document.createElement('div');
      el.className = 'photo-marker';
      el.textContent = photo.id;

      const popup = new maplibregl.Popup({ offset: 20, closeButton: false })
        .setHTML(`
          <div class="photo-popup">
            <img src="${photo.img}" alt="${photo.title}" />
            <div class="caption">
              <div class="title">${photo.title}</div>
              <div>${photo.caption}</div>
              <div class="meta">${photo.date}</div>
            </div>
          </div>
        `);

      new maplibregl.Marker({ element: el })
        .setLngLat([photo.lng, photo.lat])
        .setPopup(popup)
        .addTo(map);
    });
  });

  // Controls
  function resetView() {
    map.flyTo({ ...initialView, duration: 2000 });
  }

  function toggleTerrain() {
    terrainOn = !terrainOn;
    map.setTerrain(terrainOn ? { source: 'terrain', exaggeration: 1.5 } : null);
    if (!terrainOn) map.easeTo({ pitch: 0, duration: 800 });
    else map.easeTo({ pitch: 60, duration: 800 });
  }
</script>

</body>
</html>
