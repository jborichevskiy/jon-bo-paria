<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Paria Canyon — Trip Map</title>
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── TOP ROW: map + right panel side by side ── */
    .top-row {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* ── FULL-WIDTH HEADER ── */
    .map-header {
      flex-shrink: 0;
      padding: 12px 18px 10px;
      background: #161616;
      border-bottom: 1px solid #252525;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .map-header-left {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .map-header h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      color: #f0ede8;
      letter-spacing: 0.01em;
    }
    .map-header p {
      margin: 0;
      font-size: 12px;
      color: #555;
    }

    /* ── LEFT COLUMN: map only ── */
    .map-col {
      flex: 1;
      min-width: 0;
      position: relative;
    }
    #map { width: 100%; height: 100%; }

    #elevation-strip {
      height: 160px;
      flex-shrink: 0;
      background: #0e0e0e;
      border-top: 1px solid #222;
      position: relative;
    }
    #elevation-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    #chart-cursor {
      position: absolute;
      top: 0; bottom: 0;
      width: 1px;
      background: rgba(255,255,255,0.35);
      pointer-events: none;
      display: none;
    }
    #chart-tooltip {
      position: absolute;
      top: 8px;
      background: rgba(0,0,0,0.82);
      color: #ccc;
      font-size: 12px;
      font-family: -apple-system, "Segoe UI", sans-serif;
      line-height: 1.65;
      padding: 5px 9px;
      border-radius: 4px;
      pointer-events: none;
      display: none;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.08);
    }
    #chart-tooltip .tt-time { color: #fff; font-weight: 600; }
    #chart-tooltip .tt-ele  { color: #888; }

    /* ── RIGHT PANEL ── */
    .right-panel {
      flex: 0 0 50%;
      min-width: 280px;
      background: #161616;
      border-left: 1px solid #252525;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .rp-photo-wrap {
      flex: 1;
      min-height: 0;
      padding: 14px 14px 0;
      display: flex;
    }

    .rp-bottom {
      flex-shrink: 0;
      padding: 10px 14px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .rp-bottom.visible { opacity: 1; }

    .rp-footer {
      flex-shrink: 0;
      padding: 10px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid #1e1e1e;
      background: #161616;
    }



    .rp-photo {
      background: #161616;
      border-radius: 5px;
      overflow: hidden;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-in;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .rp-photo.visible { opacity: 1; }
    .rp-photo img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    /* ── LIGHTBOX ── */
    #lightbox {
      display: flex;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.9);
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #lightbox.open { opacity: 1; pointer-events: auto; }
    #lightbox img {
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
      border-radius: 3px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      cursor: default;
    }
    #lightbox-close {
      position: absolute;
      top: 18px;
      right: 22px;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      color: #fff;
      font-size: 20px;
      line-height: 34px;
      text-align: center;
      cursor: pointer;
      transition: background 0.15s;
      user-select: none;
    }
    #lightbox-close:hover { background: rgba(255,255,255,0.22); }
    .rp-placeholder {
      color: #333;
      font-size: 13px;
      text-align: center;
      line-height: 2;
      letter-spacing: 0.03em;
      pointer-events: none;
    }

    .rp-meta { flex-shrink: 0; }
    .rp-meta .byline {
      font-size: 14px;
      font-weight: 600;
      color: #ddd8d2;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .rp-caption {
      font-size: 12px;
      color: #888;
      line-height: 1.6;
      padding-bottom: 12px;
    }

    .rp-nav {
      display: flex;
      gap: 8px;
    }
    .rp-nav button {
      flex: 1;
      padding: 9px 6px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #2e2e2e;
      background: #1e1e1e;
      color: #aaa;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .rp-nav button:hover:not(:disabled) { background: #2a2a2a; }
    .rp-nav button:disabled { opacity: 0.3; cursor: default; }
    .rp-nav .btn-primary {
      background: #d85a30;
      color: white;
      border-color: #d85a30;
    }
    .rp-nav .btn-primary:hover:not(:disabled) { background: #c04e28; }

    .rp-progress {
      display: none;
    }

/* ── BEARING TUNING ── */
    .rp-bearing {
      display: none !important;
    }
    .bearing-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    .bearing-label {
      color: #444;
      flex-shrink: 0;
    }
    .bearing-val {
      flex: 1;
      color: #666;
      font-variant-numeric: tabular-nums;
    }
    .bearing-val.saved {
      color: #d85a30;
      font-weight: 600;
    }
    .bearing-btn {
      padding: 3px 8px;
      font-size: 12px;
      border: 1px solid #2a2a2a;
      background: #1a1a1a;
      color: #777;
      border-radius: 3px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .bearing-btn:hover { background: #242424; }
    .bearing-btn.bearing-clear {
      color: #555;
      padding: 3px 6px;
    }
    .bearing-btn.bearing-clear:hover { color: #d85a30; }

    /* ── MAP MARKERS ── */
    .photo-marker {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #d85a30;
      border: 3px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 13px;
      transition: transform 0.15s;
    }
    .photo-marker:hover { transform: scale(1.2); }
    .photo-marker.active { transform: scale(1.25); }

    /* ── MAP HAMBURGER MENU ── */
    #map-menu {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 5;
    }
    #map-menu-btn {
      width: 30px;
      height: 30px;
      background: rgba(20,20,20,0.72);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 0;
      backdrop-filter: blur(4px);
      transition: background 0.15s;
    }
    #map-menu-btn:hover { background: rgba(40,40,40,0.88); }
    #map-menu-btn span {
      display: block;
      width: 14px;
      height: 1.5px;
      background: rgba(255,255,255,0.65);
      border-radius: 1px;
      transition: background 0.15s;
    }
    #map-menu-btn:hover span { background: rgba(255,255,255,0.9); }
    #map-menu-dropdown {
      display: none;
      flex-direction: column;
      gap: 2px;
      margin-top: 6px;
      background: rgba(18,18,18,0.88);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 5px;
      padding: 5px;
      backdrop-filter: blur(6px);
      min-width: 110px;
    }
    #map-menu-dropdown.open { display: flex; }
    #map-menu-dropdown button {
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.6);
      font-size: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: left;
      padding: 6px 10px;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      white-space: nowrap;
    }
    #map-menu-dropdown button:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.9); }
    #map-menu-dropdown button.active { color: #d85a30; }
    .menu-checkbox {
      display: flex; align-items: center; gap: 6px;
      color: rgba(255,255,255,0.6); font-size: 12px;
      padding: 4px 10px; cursor: pointer;
    }
    .menu-checkbox input { cursor: pointer; }
    .menu-checkbox:hover { color: rgba(255,255,255,0.9); }

    .person-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }


/* ── EXTRA TOGGLE ── */
    #extra-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
    }
    #extra-toggle:hover { color: rgba(255,255,255,0.8); }
    #extra-toggle input { cursor: pointer; }

    /* ── PEOPLE FILTER ── */
    .people-filter {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .people-filter label {
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .people-select {
      background: rgba(20,20,20,0.72);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 4px;
      color: #ccc;
      font-size: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 4px 8px;
      cursor: pointer;
      min-width: 90px;
    }
    .people-select:hover { border-color: rgba(255,255,255,0.25); }

    /* ── DEBUG PANEL ── */
    #debug-panel {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.78);
      color: #00ff41;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 11px;
      line-height: 1.8;
      padding: 10px 14px;
      border-radius: 4px;
      z-index: 10;
      pointer-events: none;
      min-width: 220px;
    }
    #debug-panel.visible { display: block; }
    #debug-panel .dbg-label { color: #555; }
    #debug-panel .dbg-section { border-top: 1px solid #222; margin-top: 6px; padding-top: 6px; }
  </style>
</head>
<body>

<div class="map-header">
  <div class="map-header-left">
    <h1>Paria Canyon</h1>
    <p>White House TH → Lees Ferry · Apr 4–8, 2026</p>
  </div>
  <div class="people-filter">
    <label>People:</label>
    <select id="people-filter-select" class="people-select" onchange="togglePeopleFilter()">
      <option value="all">All</option>
    </select>
  </div>
  <label id="extra-toggle">
    <input type="checkbox" id="chk-extra" onchange="toggleExtra()">
    <span>Show pre- and post-adventure</span>
  </label>
</div>

<div class="top-row">

<div class="map-col">
  <div id="map"></div>
  <div id="map-menu">
    <button id="map-menu-btn" onclick="toggleMapMenu()">
      <span></span><span></span><span></span>
    </button>
    <div id="map-menu-dropdown">
      <button onclick="resetView(); closeMapMenu()">Overview</button>
      <button onclick="toggleTerrain(); closeMapMenu()">Toggle 3D</button>
      <button onclick="toggleSatellite(); closeMapMenu()" id="btn-satellite">Satellite</button>
    </div>
  </div>
  <div id="debug-panel">
    <div><span class="dbg-label">lng  </span><span id="dbg-lng">—</span></div>
    <div><span class="dbg-label">lat  </span><span id="dbg-lat">—</span></div>
    <div><span class="dbg-label">zoom </span><span id="dbg-zoom">—</span></div>
    <div><span class="dbg-label">bear </span><span id="dbg-bear">—</span></div>
    <div><span class="dbg-label">pitch</span><span id="dbg-pitch">—</span></div>
    <div class="dbg-section">
      <div><span class="dbg-label">photo</span><span id="dbg-photo">—</span></div>
      <div><span class="dbg-label">exif° </span><span id="dbg-exif">—</span></div>
    </div>
  </div>
</div>

<div class="right-panel">
  <div class="rp-photo-wrap">
    <div class="rp-photo">
      <img id="rp-img" src="" alt="" />
      <div class="rp-placeholder" id="rp-placeholder">Click Next →<br>to begin</div>
    </div>
  </div>
  <div class="rp-bottom">
    <div class="rp-meta">
      <div class="byline" id="rp-byline"></div>
    </div>
    <div class="rp-caption" id="rp-caption"></div>
  </div>
  <div class="rp-footer">
    <div class="rp-nav">
      <button onclick="console.log('prev clicked, currentIdx=', currentIdx, 'photos len=', photos.length); stepTo(currentIdx - 1)" id="btn-prev" disabled>← Prev</button>
      <button onclick="stepTo(currentIdx + 1)" id="btn-next" class="btn-primary">Next →</button>
    </div>
    <div class="rp-progress" id="progress">— of 6</div>
  </div>
</div><!-- /.right-panel -->

</div><!-- /.top-row -->

<div id="elevation-strip">
  <canvas id="elevation-canvas"></canvas>
  <div id="chart-cursor"></div>
  <div id="chart-tooltip"></div>
</div>

<div id="lightbox">
  <div id="lightbox-close" onclick="closeLightbox()">✕</div>
  <img id="lightbox-img" src="" alt="" />
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="trip-data.js"></script>

  // ============================================================
  // PHOTOS — loaded dynamically from photos/trip/{person}/captions.json
  // Add more names to TRIP_PERSONS to include additional photographers.
  // captions.json schema per entry:
  //   caption: string  (title auto-derived as text before first " - ")
  //   date:    string  e.g. "Apr 4"  (optional)
  //   time:    string  e.g. "2:30 PM" (optional; auto-derived from routeFrac if omitted)
  //   photos:  array of { file, lat, lng, routeFrac, bearing? }
  // ============================================================
  let photos = [];

  const PERSON_COLORS = {
    gary:   '#e8a020',
    lauren: '#2bb5a0',
    maggie: '#b55ad0',
    jon:    '#4a9fd0',
  };
  function personColor(person) {
    return PERSON_COLORS[person.toLowerCase()] ?? '#d85a30';
  }

  function parseSortKey(date, time) {
    const monthMap = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    let val = 0;
    if (date) {
      const parts = date.trim().split(/\s+/);
      val += (monthMap[parts[0]] ?? 0) * 31 * 24 * 60 + (parseInt(parts[1]) || 0) * 24 * 60;
    }
    if (time) {
      const m = time.match(/(\d+):(\d+)\s*(AM|PM)/i);
      if (m) {
        let h = parseInt(m[1]), mn = parseInt(m[2]);
        if (m[3].toUpperCase() === 'PM' && h !== 12) h += 12;
        if (m[3].toUpperCase() === 'AM' && h === 12) h = 0;
        val += h * 60 + mn;
      }
    }
    return val;
  }

  // loadPhotos reads from window.TRIP_DATA, generated by: node build.js
  // Add a new person by adding their photos/trip/{name}/captions.json and re-running build.js.
  function loadPhotos() {
    const all = [];
    let id = 1;
    const data = window.TRIP_DATA ?? {};
    for (const person of Object.keys(data).sort()) {
      const personLabel = person[0].toUpperCase() + person.slice(1);
      const groups = data[person] ?? [];
      for (const group of groups) {
        const caption = group.caption ?? '';
        const title   = group.title ?? caption.split(' - ')[0] ?? '';
        const date    = group.date  ?? '';
        // support both new { photos: [{file,lat,lng,...}] } and legacy { photo: string|string[] }
        let entries;
        if (Array.isArray(group.photos)) {
          entries = group.photos;
        } else {
          const files = Array.isArray(group.photo) ? group.photo : (group.photo ? [group.photo] : []);
          entries = files.map(f => ({ file: f }));
        }
        for (const ph of entries) {
          const frac = ph.routeFrac ?? null;
          const time = ph.time ?? group.time ?? (frac !== null ? formatHour(hourAtFrac(frac)) : '');
          const photoDate = ph.date ?? date;
          all.push({
            id: id++,
            person: personLabel,
            color: personColor(person),
            lng: ph.lng ?? 0,
            lat: ph.lat ?? 0,
            date: photoDate,
            time,
            title,
            caption,
            img: `photos/trip/${person}/${ph.file}`,
            bearing: ph.bearing ?? 0,
            routeFrac: frac ?? 0,
            sortKey: parseSortKey(photoDate, time),
            extra: ph.extra ?? false,
          });
        }
      }
    }
    all.sort((a, b) => a.sortKey - b.sortKey);
    all.forEach((p, i) => p.id = i + 1);
    return all;
  }

  let showExtra = false;
  let selectedPeople = null; // null = all, otherwise array of lowercase person names
  let allPeople = [];

  function getFilteredPhotos() {
    const all = loadPhotos();
    let filtered = showExtra ? all : all.filter(p => !p.extra);
    if (selectedPeople && selectedPeople.length > 0) {
      filtered = filtered.filter(p => selectedPeople.includes(p.person.toLowerCase()));
    }
    return filtered;
  }

  function initPeopleFilter() {
    const data = window.TRIP_DATA ?? {};
    allPeople = Object.keys(data).sort();
    const select = document.getElementById('people-filter-select');
    allPeople.forEach(person => {
      const titleName = person.charAt(0).toUpperCase() + person.slice(1);
      const opt = document.createElement('option');
      opt.value = person;
      opt.textContent = titleName;
      select.appendChild(opt);
    });
  }

  function togglePeopleFilter() {
    const select = document.getElementById('people-filter-select');
    const val = select.value;
    if (val === 'all') {
      selectedPeople = null;
    } else {
      selectedPeople = [val];
    }
    const prevImg = document.getElementById('rp-img').src;
    const wasViewing = currentIdx >= 0;
    photos = getFilteredPhotos();
    currentIdx = -1;
    chartCache = null;
    rebuildMarkers();
    drawElevationChart();
    let newIdx = 0;
    if (prevImg) {
      const match = photos.findIndex(p => p.img && prevImg.endsWith(p.img));
      if (match >= 0) newIdx = match;
    }
    stepTo(newIdx, false);
  }

  // ============================================================
  // MAP SETUP
  // ============================================================
  const initialView = { center: [-111.741, 36.973], zoom: 10, pitch: 60, bearing: -15 };

  const map = new maplibregl.Map({

    style: `https://api.maptiler.com/maps/topo-v2/style.json?key=${MAPTILER_KEY}`,

  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

  let terrainOn = true;

    });

    photos = getFilteredPhotos();
    initPeopleFilter();
    loadSavedViewpoints();
    rebuildMarkers();

    drawElevationChart();

  // ============================================================
  // ELEVATION CHART
  // ============================================================
  const CHART_PAD = { top: 18, right: 20, bottom: 28, left: 48 };

  // Precomputed constants — elevationProfile is static
  const _profileEles = elevationProfile.map(p => p[1]);
  const ELEV_MIN   = Math.min(..._profileEles);
  const ELEV_MAX   = Math.max(..._profileEles);
  const ELEV_RANGE = ELEV_MAX - ELEV_MIN;

  function elevationAtFrac(frac) {
    for (let i = 1; i < elevationProfile.length; i++) {
      if (elevationProfile[i][0] >= frac) {
        const [f0, e0] = elevationProfile[i - 1];
        const [f1, e1] = elevationProfile[i];
        const t = f1 === f0 ? 0 : (frac - f0) / (f1 - f0);
        return e0 + t * (e1 - e0);
      }
    }
    return elevationProfile[elevationProfile.length - 1][1];
  }

  function hourAtFrac(frac) {
    for (let i = 1; i < elevationProfile.length; i++) {
      if (elevationProfile[i][0] >= frac) {
        const [f0,, h0] = elevationProfile[i - 1];
        const [f1,, h1] = elevationProfile[i];
        if (h1 < h0 - 2) return h0; // overnight gap — don't interpolate
        const t = f1 === f0 ? 0 : (frac - f0) / (f1 - f0);
        return h0 + t * (h1 - h0);
      }
    }
    return elevationProfile[elevationProfile.length - 1][2];
  }

  function dayAtFrac(frac) {
    if (frac < 0.3308) return 1;
    if (frac < 0.6653) return 2;
    return 3;
  }

  // Map hour of day → rgba components for background tint
  function timeToRGBA(h) {
    const stops = [
      [0,    [8,  12, 45,  0.95]],
      [6.0,  [30, 50, 120, 0.80]],
      [7.0,  [50, 90, 160, 0.55]],
      [8.5,  [70, 120,190, 0.40]],
      [10.0, [110,160,210, 0.28]],
      [11.0, [180,200,220, 0.18]],
      [12.0, [255,230,150, 0.22]],
      [13.5, [255,225,130, 0.28]],
      [15.0, [255,215,120, 0.26]],
      [16.0, [200,190,220, 0.22]],
      [17.0, [120,130,200, 0.38]],
      [18.0, [70, 80, 170, 0.55]],
      [19.0, [40, 45, 120, 0.72]],
      [20.5, [12, 15, 50,  0.90]],
      [24.0, [8,  12, 45,  0.95]],
    ];
    for (let i = 1; i < stops.length; i++) {
      if (h <= stops[i][0]) {
        const t = (h - stops[i-1][0]) / (stops[i][0] - stops[i-1][0]);
        const [r0,g0,b0,a0] = stops[i-1][1];
        const [r1,g1,b1,a1] = stops[i][1];
        return [
          Math.round(r0 + t*(r1-r0)),
          Math.round(g0 + t*(g1-g0)),
          Math.round(b0 + t*(b1-b0)),
          +(a0 + t*(a1-a0)).toFixed(3)
        ];
      }
    }
    return stops[stops.length-1][1];
  }

  function skyColorsAtHour(h) {
    const toHex = (r,g,b) => '#' + [r,g,b].map(v => Math.round(v).toString(16).padStart(2,'0')).join('');
    const [sr,sg,sb] = timeToRGBA(h);
    const [hr,hg,hb] = timeToRGBA(Math.max(0, h - 1.5)); // horizon slightly warmer (dawn/dusk glow)
    return { sky: toHex(sr,sg,sb), horizon: toHex(hr,hg,hb), fog: toHex(hr,hg,hb) };
  }

  function formatHour(h) {
    const hr = Math.floor(h), mn = Math.round((h - hr) * 60);
    const ampm = hr >= 12 ? 'PM' : 'AM';
    const hr12 = hr > 12 ? hr - 12 : (hr === 0 ? 12 : hr);
    return `${hr12}:${String(mn).padStart(2,'0')} ${ampm}`;
  }

  // ── Offscreen cache for the static chart layers (everything except photo squares) ──
  let chartCache = null; // { offscreen, W, H, xS, yS, photoPos }

  function buildChartCache(W, H) {
    const P = CHART_PAD;
    const xS = f => P.left + f * (W - P.left - P.right);
    const yS = e => H - P.bottom - ((e - ELEV_MIN) / ELEV_RANGE) * (H - P.top - P.bottom);

    const offscreen = document.createElement('canvas');
    offscreen.width  = W * devicePixelRatio;
    offscreen.height = H * devicePixelRatio;
    const ctx = offscreen.getContext('2d');
    ctx.scale(devicePixelRatio, devicePixelRatio);

    // 1. Time-of-day background gradient strips
    for (let i = 0; i < elevationProfile.length - 1; i++) {
      const [f0,,h0] = elevationProfile[i];
      const [f1,,h1] = elevationProfile[i+1];
      const x0 = xS(f0), x1 = xS(f1);
      if (h1 < h0 - 2) {
        ctx.fillStyle = 'rgba(4,4,18,0.96)';
        ctx.fillRect(x0, P.top, x1 - x0 + 1, H - P.top - P.bottom);
      } else {
        const [r0,g0,b0,a0] = timeToRGBA(h0);
        const [r1,g1,b1,a1] = timeToRGBA(h1);
        const grad = ctx.createLinearGradient(x0, 0, x1, 0);
        grad.addColorStop(0, `rgba(${r0},${g0},${b0},${a0})`);
        grad.addColorStop(1, `rgba(${r1},${g1},${b1},${a1})`);
        ctx.fillStyle = grad;
        ctx.fillRect(x0, P.top, x1 - x0 + 1, H - P.top - P.bottom);
      }
    }

    // Camp markers at overnight transitions
    [0.3308, 0.6653].forEach(cf => {
      const cx = xS(cf);
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(cx - 0.5, P.top, 1, H - P.top - P.bottom);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.font = '9px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('camp', cx, P.top - 4);
    });

    // 2. Filled area under elevation line
    ctx.beginPath();
    elevationProfile.forEach(([f,e],i) => i===0 ? ctx.moveTo(xS(f),yS(e)) : ctx.lineTo(xS(f),yS(e)));
    ctx.lineTo(xS(1), H - P.bottom);
    ctx.lineTo(xS(0), H - P.bottom);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fill();

    // 3. Elevation line
    ctx.beginPath();
    elevationProfile.forEach(([f,e],i) => i===0 ? ctx.moveTo(xS(f),yS(e)) : ctx.lineTo(xS(f),yS(e)));
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // 4. Baseline
    ctx.beginPath();
    ctx.moveTo(xS(0), H - P.bottom);
    ctx.lineTo(xS(1), H - P.bottom);
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 5. Y-axis labels
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    const ftMin = Math.round(ELEV_MIN * 3.28084 / 100) * 100;
    const ftMax = Math.round(ELEV_MAX * 3.28084 / 100) * 100;
    for (let ft = ftMin; ft <= ftMax; ft += 500) {
      const m = ft / 3.28084;
      if (m < ELEV_MIN || m > ELEV_MAX) continue;
      const y = yS(m);
      ctx.fillText(ft.toLocaleString() + ' ft', P.left - 6, y + 3.5);
      ctx.beginPath();
      ctx.moveTo(P.left - 3, y);
      ctx.lineTo(xS(1), y);
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Precompute photo pixel positions — x by time (sortKey), y at baseline
    // Use ALL photos (loadPhotos) for the chart, not just filtered
    const allPhotos = loadPhotos();
    const sortKeys = allPhotos.map(p => p.sortKey);
    const minSK = Math.min(...sortKeys);
    const maxSK = Math.max(...sortKeys);
    const skRange = maxSK - minSK || 1;
    const xT = sk => P.left + (sk - minSK) / skRange * (W - P.left - P.right);
    const photoPos = allPhotos.map(p => ({
      x: xT(p.sortKey),
      y: yS(elevationAtFrac(p.routeFrac))
    }));

    chartCache = { offscreen, W, H, xS, yS, photoPos, allPhotos };
  }

  function drawElevationChart(activeIdx) {
    const canvas = document.getElementById('elevation-canvas');
    const strip  = document.getElementById('elevation-strip');
    const W = strip.clientWidth, H = strip.clientHeight;

    if (!chartCache || chartCache.W !== W || chartCache.H !== H) {
      buildChartCache(W, H);
    }

    canvas.width  = W * devicePixelRatio;
    canvas.height = H * devicePixelRatio;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';

    const ctx = canvas.getContext('2d');
    ctx.drawImage(chartCache.offscreen, 0, 0);
    ctx.scale(devicePixelRatio, devicePixelRatio);

    const { photoPos, allPhotos } = chartCache;
    const filteredSet = new Set(photos.map(p => p.id));
    const SQ = 9;

    allPhotos.forEach((photo, i) => {
      const { x, y = 0 } = photoPos[i] || {};
      if (x === undefined) return;
      const isFiltered = filteredSet.has(photo.id);
      const activePhoto = photos[activeIdx];
      const isActive = activePhoto && activePhoto.id === photo.id;
      const s = isActive ? SQ + 3 : SQ;

      if (!isFiltered) {
        ctx.fillStyle   = '#444';
        ctx.strokeStyle = '#555';
        ctx.lineWidth   = 1;
      } else {
        ctx.fillStyle   = isActive ? '#ffffff' : photo.color;
        ctx.strokeStyle = isActive ? photo.color : 'rgba(255,255,255,0.5)';
        ctx.lineWidth   = isActive ? 2 : 1.5;
      }
      ctx.beginPath();
      ctx.rect(x - s/2, y - s/2, s, s);
      ctx.fill();
      ctx.stroke();
    });
  }

  // ── Hover: cursor line + tooltip (rAF-throttled) ──
  (function() {
    const canvas  = document.getElementById('elevation-canvas');
    const strip   = document.getElementById('elevation-strip');
    const cursor  = document.getElementById('chart-cursor');
    const tooltip = document.getElementById('chart-tooltip');
    let rafPending = false;
    let pendingEvent = null;

    canvas.addEventListener('mousemove', e => {
      pendingEvent = e;
      if (rafPending) return;
      rafPending = true;
      requestAnimationFrame(() => {
        rafPending = false;
        const ev = pendingEvent;
        const W = strip.clientWidth;
        const P = CHART_PAD;
        const chartW = W - P.left - P.right;
        const rect = strip.getBoundingClientRect();
        const mx   = ev.clientX - rect.left;
        const frac = Math.max(0, Math.min(1, (mx - P.left) / chartW));

        cursor.style.left    = mx + 'px';
        cursor.style.display = 'block';

        const ele  = elevationAtFrac(frac);
        const hour = hourAtFrac(frac);
        const day  = dayAtFrac(frac);
        const eleFt = Math.round(ele * 3.28084).toLocaleString();
        const tipW = 130;
        tooltip.innerHTML  = `<span class="tt-time">${formatHour(hour)}</span> · Day ${day}<br><span class="tt-ele">${eleFt} ft</span>`;
        tooltip.style.left = (mx + 12 + tipW > W ? mx - tipW - 6 : mx + 12) + 'px';
        tooltip.style.display = 'block';
      });
    });

    canvas.addEventListener('mouseleave', () => {
      cursor.style.display  = 'none';
      tooltip.style.display = 'none';
    });

    // Click to navigate to nearest photo — uses cached pixel positions
    canvas.addEventListener('click', e => {
      if (!chartCache || !chartCache.allPhotos) return;
      const rect = strip.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const HIT = 14;
      const { photoPos, allPhotos } = chartCache;
      const filteredSet = new Set(photos.map(p => p.id));
      for (let i = 0; i < allPhotos.length; i++) {
        const { x, y = 0 } = photoPos[i] || {};
        if (x === undefined) continue;
        if (Math.abs(mx - x) < HIT && Math.abs(my - y) < HIT) {
          if (!filteredSet.has(allPhotos[i].id)) return; // skip grayed-out photos
          const newIdx = photos.findIndex(p => p.id === allPhotos[i].id);
          if (newIdx >= 0) { stepTo(newIdx, true); return; }
        }
      }
    });
  })();

  window.addEventListener('resize', () => {
    chartCache = null; // invalidate on resize
    drawElevationChart(currentIdx >= 0 ? currentIdx : undefined);
  });

  // ============================================================
  // PER-PHOTO VIEWPOINT — persisted in localStorage
  // Captures: center (lng/lat), zoom, pitch, bearing
  // ============================================================
  const VIEWPOINT_KEY = 'paria-viewpoints';

  function loadSavedViewpoints() {
    try {
      const saved = JSON.parse(localStorage.getItem(VIEWPOINT_KEY) || '{}');
      photos.forEach(p => {
        if (saved[p.id] !== undefined) p.viewpoint = saved[p.id];
      });
    } catch (e) {}
  }

  function persistViewpoints() {
    const out = {};
    photos.forEach(p => { if (p.viewpoint !== undefined) out[p.id] = p.viewpoint; });
    localStorage.setItem(VIEWPOINT_KEY, JSON.stringify(out));
  }

  function saveViewpoint() {
    if (currentIdx < 0) return;
    const c = map.getCenter();
    photos[currentIdx].viewpoint = {
      lng:     +c.lng.toFixed(6),
      lat:     +c.lat.toFixed(6),
      zoom:    +map.getZoom().toFixed(2),
      pitch:   +map.getPitch().toFixed(1),
      bearing: +map.getBearing().toFixed(1),
    };
    persistViewpoints();
    updateViewpointUI(currentIdx);
  }

  function clearViewpoint() {
    if (currentIdx < 0) return;
    delete photos[currentIdx].viewpoint;
    persistViewpoints();
    updateViewpointUI(currentIdx);
  }

  function updateViewpointUI(idx) {
    const section  = document.getElementById('rp-bearing');
    const val      = document.getElementById('bearing-val');
    const clearBtn = document.getElementById('bearing-clear');
    if (!section || !val || !clearBtn) return;
    if (idx < 0) { section.style.display = 'none'; return; }
    section.style.display = '';
    const p = photos[idx];
    if (p.viewpoint !== undefined) {
      const vp = p.viewpoint;
      val.textContent = `${vp.bearing.toFixed(1)}° · z${vp.zoom.toFixed(1)} · p${vp.pitch.toFixed(0)}°`;
      val.className = 'bearing-val saved';
      clearBtn.style.display = '';
    } else {
      val.textContent = 'auto';
      val.className = 'bearing-val';
      clearBtn.style.display = 'none';
    }
  }

  // ============================================================
  // CAMERA NAVIGATION
  // ============================================================
  let currentIdx = -1;
  let markers = [];

  function isPersonSelected(person) {
    if (!selectedPeople) return true;
    return selectedPeople.includes(person.toLowerCase());
  }

  function rebuildMarkers() {
    markers.forEach(m => m.remove());
    const allPhotos = loadPhotos();
    const filteredSet = new Set(photos.map(p => p.id));
    markers = allPhotos.map((photo) => {
      const el = document.createElement('div');
      el.className = 'photo-marker';
      el.textContent = photo.id;
      const isFiltered = filteredSet.has(photo.id);
      if (!isFiltered) {
        el.style.background   = '#444';
        el.style.borderColor  = '#666';
        el.style.color        = '#666';
        el.style.opacity      = '0.5';
      } else {
        el.style.background   = photo.color;
        el.style.borderColor  = 'white';
        el.style.color        = 'white';
      }

      const marker = new maplibregl.Marker({ element: el })
        .setLngLat([photo.lng, photo.lat])
        .addTo(map);

      el.addEventListener('click', () => {
        const newIdx = photos.findIndex(p => p.id === photo.id);
        if (newIdx >= 0) stepTo(newIdx, true);
      });
      return marker;
    });
  }

  function bearingBetween(a, b) {
    const toRad = d => d * Math.PI / 180;
    const toDeg = r => r * 180 / Math.PI;
    const dLng = toRad(b[0] - a[0]);
    const lat1 = toRad(a[1]), lat2 = toRad(b[1]);
    const y = Math.sin(dLng) * Math.cos(lat2);
    const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }

  function stepTo(idx, fromMarkerClick = false) {
    console.log('stepTo: idx=', idx, 'photos.length=', photos.length);
    if (idx < 0 || idx >= photos.length) return;
    if (!markers || idx >= markers.length) return;

    if (currentIdx >= 0 && currentIdx < markers.length) {
      const prevEl = markers[currentIdx].getElement();
      if (prevEl) {
        prevEl.classList.remove('active');
        prevEl.style.background  = photos[currentIdx].color;
        prevEl.style.color       = 'white';
        prevEl.style.borderColor = 'white';
      }
    }

    currentIdx = idx;
    const p = photos[idx];
    const next = photos[Math.min(idx + 1, photos.length - 1)];
    const dur = fromMarkerClick ? 1400 : 2200;

    const skyC = skyColorsAtHour(hourAtFrac(p.routeFrac));
    map.setSky({
      'sky-color': skyC.sky,
      'sky-horizon-blend': 0.6,
      'horizon-color': skyC.horizon,
      'horizon-fog-blend': 0.8,
      'fog-color': skyC.fog,
      'fog-ground-blend': 0.3
    });
    if (p.viewpoint) {
      const vp = p.viewpoint;
      map.flyTo({
        center: [vp.lng, vp.lat], zoom: vp.zoom, pitch: vp.pitch, bearing: vp.bearing,
        duration: dur, essential: true
      });
    } else {
      const bearing = bearingBetween([p.lng, p.lat], [next.lng, next.lat]);
      map.flyTo({
        center: [p.lng, p.lat], zoom: 13.5, pitch: 65, bearing,
        duration: dur, essential: true
      });
    }

    map.once('moveend', () => {
      const activeEl = markers[currentIdx].getElement();
      activeEl.classList.add('active');
      activeEl.style.background  = '#fff';
      activeEl.style.color       = photos[currentIdx].color;
      activeEl.style.borderColor = photos[currentIdx].color;
    });

    // Update right panel
    const photo   = document.querySelector('.rp-photo');
    const bottom  = document.querySelector('.rp-bottom');
    const img     = document.getElementById('rp-img');
    const ph      = document.getElementById('rp-placeholder');

    const showContent = () => {
      img.onload = () => { img.style.display = ''; photo.classList.add('visible'); ph.style.display = 'none'; };
      img.src = p.img;
      if (img.complete && img.naturalWidth) { img.style.display = ''; photo.classList.add('visible'); ph.style.display = 'none'; }
      document.getElementById('rp-byline').innerHTML =
        `<span class="person-dot" style="background:${p.color}"></span>${p.person}, ${[p.date, p.time].filter(Boolean).join(' · ')}`;
      document.getElementById('rp-caption').textContent = p.caption;
      bottom.classList.add('visible');
    };

    if (photo.classList.contains('visible')) {
      photo.classList.remove('visible');
      bottom.classList.remove('visible');
      photo.addEventListener('transitionend', showContent, { once: true });
    } else {
      showContent();
    }

    document.getElementById('btn-prev').disabled = idx === 0;
    document.getElementById('btn-next').disabled = idx === photos.length - 1;
    document.getElementById('btn-next').textContent = idx === photos.length - 1 ? 'Done' : 'Next →';
    document.getElementById('progress').textContent = `${idx + 1} of ${photos.length}`;
    console.log('stepTo: buttons updated, prev disabled=', document.getElementById('btn-prev').disabled);

    updateViewpointUI(idx);
    drawElevationChart(idx);
  }

  function resetView() {
    if (currentIdx >= 0) {
      markers[currentIdx].getElement().classList.remove('active');
    }
    currentIdx = -1;

    document.querySelector('.rp-photo').classList.remove('visible');
    document.querySelector('.rp-bottom').classList.remove('visible');
    document.getElementById('rp-img').src = '';
    document.getElementById('rp-placeholder').style.display = '';
    document.getElementById('rp-byline').innerHTML = '';
    document.getElementById('rp-caption').textContent = '';
    document.getElementById('btn-prev').disabled = true;
    document.getElementById('btn-next').disabled = false;
    document.getElementById('btn-next').textContent = 'Next →';
    document.getElementById('progress').textContent = `— of ${photos.length}`;

    updateViewpointUI(-1);
    map.flyTo({ ...initialView, duration: 2000 });
    drawElevationChart();
  }

  function toggleTerrain() {
    terrainOn = !terrainOn;
    map.setTerrain(terrainOn ? { source: 'terrain', exaggeration: 1.5 } : null);
    map.easeTo({ pitch: terrainOn ? 60 : 0, duration: 800 });
  }

  // ============================================================
  // DEBUG PANEL — D key
  // ============================================================
  const debugPanel = document.getElementById('debug-panel');
  let debugOn = false;

  function updateDebug() {
    if (!debugOn) return;
    const c = map.getCenter();
    document.getElementById('dbg-lng').textContent   = c.lng.toFixed(6);
    document.getElementById('dbg-lat').textContent   = c.lat.toFixed(6);
    document.getElementById('dbg-zoom').textContent  = map.getZoom().toFixed(2);
    document.getElementById('dbg-bear').textContent  = map.getBearing().toFixed(1) + '°';
    document.getElementById('dbg-pitch').textContent = map.getPitch().toFixed(1) + '°';
    if (currentIdx >= 0) {
      const p = photos[currentIdx];
      document.getElementById('dbg-photo').textContent = `#${p.id} (${p.date})`;
      document.getElementById('dbg-exif').textContent  = p.bearing.toFixed(1) + '°';
    } else {
      document.getElementById('dbg-photo').textContent = '—';
      document.getElementById('dbg-exif').textContent  = '—';
    }
  }

  map.on('move', updateDebug);
  document.addEventListener('keydown', e => {
    if (e.key === 'd') {
      debugOn = !debugOn;
      debugPanel.classList.toggle('visible', debugOn);
      if (debugOn) updateDebug();
    }
  });

  // ============================================================
  // SATELLITE TOGGLE
  // ============================================================
  let satelliteOn = true;
  function setSatelliteButtonState(on) {
    const btn = document.getElementById('btn-satellite');
    btn.classList.toggle('active', on);
  }
  function toggleSatellite() {
    satelliteOn = !satelliteOn;
    map.setLayoutProperty('satellite-layer', 'visibility', satelliteOn ? 'visible' : 'none');
    setSatelliteButtonState(satelliteOn);
  }
  function toggleExtra() {
    const prevImg = document.getElementById('rp-img').src;
    console.log('toggleExtra: prevImg=', prevImg);
    const wasViewing = currentIdx >= 0;
    showExtra = document.getElementById('chk-extra').checked;
    photos = getFilteredPhotos();
    console.log('toggleExtra: photos.length=', photos.length);
    currentIdx = -1;  // reset so stepTo handles active state cleanly
    chartCache = null;  // force chart rebuild for new photos
    rebuildMarkers();
    drawElevationChart();
    let newIdx = 0;
    if (prevImg) {
      const match = photos.findIndex(p => p.img && prevImg.endsWith(p.img));
      console.log('toggleExtra: match index=', match);
      if (match >= 0) newIdx = match;
    }
    console.log('toggleExtra: calling stepTo(', newIdx, ')');
    stepTo(newIdx, false);
    console.log('toggleExtra: after stepTo, currentIdx=', currentIdx);
  }

  // ============================================================
  // MAP HAMBURGER MENU
  // ============================================================
  function toggleMapMenu() {
    document.getElementById('map-menu-dropdown').classList.toggle('open');
  }
  function closeMapMenu() {
    document.getElementById('map-menu-dropdown').classList.remove('open');
  }
  document.addEventListener('click', e => {
    const menu = document.getElementById('map-menu');
    if (!menu.contains(e.target)) closeMapMenu();
  });

  // ============================================================
  // LIGHTBOX
  // ============================================================
  function openLightbox(src) {
    const lb = document.getElementById('lightbox');
    document.getElementById('lightbox-img').src = src;
    lb.classList.add('open');
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
  }

  document.getElementById('lightbox').addEventListener('click', closeLightbox);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
  });

  document.querySelector('.rp-photo').addEventListener('click', function() {
    const src = document.getElementById('rp-img').src;
    if (this.classList.contains('visible') && src) openLightbox(src);
  });
</script>
</body>
